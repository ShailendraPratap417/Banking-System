server.port=8080

# H2 Database settings
spring.datasource.url=jdbc:h2:file:./data/banking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console settings (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Secret and Expiration (in milliseconds)
# 256-bit secret key in hex format
banking.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
banking.jwt.expirationMs=86400000
